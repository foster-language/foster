[package]
name = "foster-compiler-core"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# Bootstrap compiles these same sources without their generated library.
[lib]
path = "../src/lib.rs"

[features]
test-support = []
compiler-profile = []

[dependencies]
foster-bytecode = { path = "../../bytecode" }
foster-host = { path = "../../host" }
ariadne = "0.6"
camino = "1.2"
la-arena = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2.5"

[dev-dependencies]
foster-vm = { path = "../../vm" }

[build-dependencies]
foster-bootstrap = { path = "../bootstrap" }
