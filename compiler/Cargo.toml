[package]
name = "foster-compiler"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
path = "facade.rs"

[features]
test-support = ["foster-compiler-core/test-support"]
compiler-profile = ["foster-compiler-core/compiler-profile"]

[dependencies]
foster-compiler-core = { path = "core" }
foster-compiler-native = { path = "native" }

[dev-dependencies]
foster-vm = { path = "../vm" }
